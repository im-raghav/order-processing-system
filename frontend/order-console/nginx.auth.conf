server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gate the whole app (including the API proxy below) behind HTTP Basic Auth. The
  # application itself has no login by design (per the assignment's own constraints) - this
  # is a reverse-proxy-level gate so a public deployment isn't wide open to anyone with the
  # URL, without touching the app's no-auth design.
  auth_basic "Order Processing System";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location /api/ {
    proxy_pass http://coordinator:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
